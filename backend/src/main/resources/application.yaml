# =============================================================================
# DSY1107 - PARCIAL1 - Configuracion del backend.
#
# Toodo lo de aqui se puede pisar con variables de entorno, que es como se
# configura en ECS (terraform/ecs.tf) y en GitHub Actions (backend_deploy.yml):
#
#   SPRING_DATASOURCE_URL=...
#   SPRING_DATASOURCE_PASSWORD=...
#   SERVER_PORT=9090
# =============================================================================

spring:
  application:
    name: ae1-backend

  # ---------------------------------------------------------------------------
  # La base del CRUD de /solicitudes (terraform/rds.tf).
  #
  # Hay dos formas de darle valores, y las dos sirven:
  #
  #   a) Por variable de entorno, sin tocar este archivo. Es lo que hace ECS
  #      (el bloque environment de la task, en terraform/ecs.tf), y en local:
  #
  #        export SPRING_DATASOURCE_PASSWORD=... (ya en ~/.bashrc)
  #        ./mvnw spring-boot:run
  #
  #   b) Escribiendo el valor aqui mismo, en lugar del ${...}:
  #
  #        url: jdbc:postgresql://<host>.rds.amazonaws.com:5432/dsy1107?sslmode=require
  #
  #      El sslmode=require no es opcional: desde PostgreSQL 15, RDS rechaza
  #      toda conexion en claro. Sin el, el arranque falla con "no pg_hba.conf
  #      entry for host ... no encryption", que suena a permisos y es cifrado.
  #
  # LA CONTRASEÑA NO TIENE VALOR POR DEFECTO A PROPOSITO: este archivo SI se
  # versiona (va a GitHub), asi que un default aqui expondria la clave real de
  # RDS en el repositorio. Sin variable de entorno, el proceso simplemente no
  # arranca -- eso es preferible a arrancar con una clave filtrada en el codigo.
  # ---------------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dsy1107-db-grupoxx-mulatti-parcial2.cncwygkwqac0.us-east-1.rds.amazonaws.com:5432/dsy1107?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # validate, no update: al arrancar comprueba que las entidades y las
      # tablas coincidan, y si no, se cae con un mensaje claro. El esquema lo
      # manda Flyway (V1__solicitud.sql), no Hibernate.
      ddl-auto: validate

    # Sin esto, la sesion de JPA queda abierta durante toodo el render de la
    # respuesta. Aqui el controlador ya convierte a records (SolicitudVista)
    # antes de responder, asi que no hace falta.
    open-in-view: false

  flyway:
    # El esquema vive en db/migration (V1__solicitud.sql) y se aplica al
    # arrancar. Crea la tabla "solicitud" la primera vez que corre.
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_QOsAjFxhO




server:
  port: 8080
  # Sin esto, un error devuelve la pagina de error de Spring. Con esto, el JSON
  # de ManejadorDeErrores llega tal cual al front (404, 403, 409 segun el caso).
  error:
    include-message: always
    include-stacktrace: never


backend:
  cors:
    # Solo para el modo local, apuntando el front derecho al :8080. En el
    # despliegue real el CORS lo pone el API Gateway. Sin barra final.
    origenes:
      - http://localhost:5173
      - https://main.d2ou1c1vjbjjq4.amplifyapp.com

# -----------------------------------------------------------------------------
# Actuator: /actuator/health es el health check que usa ECS (healthCheck en
# terraform/ecs.tf) para saber si la task sigue viva.
#
#   exposure.include: health  -> por HTTP no se publica nada mas. Este backend
#     no valida el token (eso lo hace el JWT authorizer del API Gateway), asi
#     que lo que se exponga aqui queda al alcance de quien alcance el 8080.
#
#   show-details: never       -> la respuesta es exactamente {"status":"UP"}.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false

logging:
  level:
    cl.duoc.dsy1107.ae1: DEBUG